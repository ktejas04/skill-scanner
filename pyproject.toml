[project]
name = "skill-scanner"
version = "1.0.0"
description = "AI-powered malicious skill file scanner using Groq"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Tejas Kumar"}
]
keywords = ["security", "ai", "scanner", "skills", "groq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "groq>=0.4.0",
    "PyYAML>=6.0",
]

[project.scripts]
skill-scan = "scanner.cli:main"

[project.urls]
Repository = "https://github.com/ktejas04/skill-scanner"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scanner*"]
