name: Scan Skills for Malicious Content

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run malicious content scanner
        id: scan
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Run scan and capture exit code
          python -m scanner -d skills -f json -o scan-results.json || echo "SCAN_FAILED=true" >> $GITHUB_OUTPUT
          
          # Always generate the comment (even on failure)
          python scanner/pr_comment.py scan-results.json > pr-comment.md
          
          # Check if scan failed
          if [ -f scan-results.json ]; then
            HAS_MALICIOUS=$(python -c "import json; print(json.load(open('scan-results.json')).get('has_malicious', False))")
            echo "HAS_MALICIOUS=$HAS_MALICIOUS" >> $GITHUB_OUTPUT
          fi

      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('pr-comment.md', 'utf8');
            
            // Find existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && 
              c.body.includes('Security Scan')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

      - name: Fail if malicious content detected
        if: steps.scan.outputs.HAS_MALICIOUS == 'True'
        run: |
          echo "❌ Malicious content detected in skill files!"
          exit 1
